# Hạ tầng: PostgreSQL (multi-DB), Redis, Kafka (KRaft single node)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: qtkd
data:
  init-multi-db.sql: |
    CREATE DATABASE authdb;
    CREATE DATABASE customerdb;
    CREATE DATABASE contractdb;
    CREATE DATABASE pricingdb;
    CREATE DATABASE billingdb;
    CREATE DATABASE workflowdb;
    CREATE DATABASE notifdb;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: qtkd
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_USER, value: "qtkd" }
            - { name: POSTGRES_PASSWORD, value: "qtkd" }
            - { name: POSTGRES_DB, value: "postgres" }
          ports: [{ containerPort: 5432 }]
          volumeMounts:
            - { name: initsql, mountPath: /docker-entrypoint-initdb.d }
            - { name: data, mountPath: /var/lib/postgresql/data }
      volumes:
        - name: initsql
          configMap: { name: postgres-init }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: qtkd }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: qtkd
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: qtkd }
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: qtkd
spec:
  replicas: 1
  selector: { matchLabels: { app: kafka } }
  template:
    metadata: { labels: { app: kafka } }
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.7.0
          ports: [{ containerPort: 9092 }]
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@kafka:9093" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "true" }
            - { name: CLUSTER_ID, value: "qtkd-cluster-0001" }
---
apiVersion: v1
kind: Service
metadata: { name: kafka, namespace: qtkd }
spec:
  selector: { app: kafka }
  ports: [{ port: 9092, targetPort: 9092 }]
