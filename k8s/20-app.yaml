# Các microservice ứng dụng. Image build sẵn từ docker-compose (qtkd-<service>).
# Nạp image vào minikube trước: xem k8s/README.md
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: identity-service, namespace: qtkd }
spec:
  replicas: 1
  selector: { matchLabels: { app: identity-service } }
  template:
    metadata: { labels: { app: identity-service } }
    spec:
      containers:
        - name: identity-service
          image: qtkd-identity-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8001 }]
          envFrom:
            - configMapRef: { name: qtkd-config }
            - secretRef: { name: qtkd-secret }
          env:
            - { name: SERVICE_NAME, value: identity-service }
            - { name: PORT, value: "8001" }
            - { name: DATABASE_URL, value: "postgresql+psycopg2://qtkd:qtkd@postgres:5432/authdb" }
---
apiVersion: v1
kind: Service
metadata: { name: identity-service, namespace: qtkd }
spec:
  selector: { app: identity-service }
  ports: [{ port: 8001, targetPort: 8001 }]
---
