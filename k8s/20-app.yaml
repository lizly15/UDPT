apiVersion: apps/v1
kind: Deployment
metadata: { name: api-gateway, namespace: qtkd }
spec:
  replicas: 1
  selector: { matchLabels: { app: api-gateway } }
  template:
    metadata: { labels: { app: api-gateway } }
    spec:
      containers:
        - name: api-gateway
          image: qtkd-api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: qtkd-config }
            - secretRef: { name: qtkd-secret }
          env:
            - { name: SERVICE_NAME, value: api-gateway }
            - { name: PORT, value: "8080" }
            - { name: IDENTITY_URL, value: "http://identity-service:8001" }
            - { name: CUSTOMER_URL, value: "http://customer-service:8002" }
            - { name: CONTRACT_URL, value: "http://contract-service:8003" }
            - { name: PRICING_URL, value: "http://pricing-service:8004" }
            - { name: BILLING_URL, value: "http://billing-service:8005" }
            - { name: WORKFLOW_URL, value: "http://workflow-service:8006" }
            - { name: NOTIFICATION_URL, value: "http://notification-service:8007" }
---
apiVersion: v1
kind: Service
metadata: { name: api-gateway, namespace: qtkd }
spec:
  type: NodePort
  selector: { app: api-gateway }
  ports: [{ port: 8080, targetPort: 8080, nodePort: 30080 }]
